services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PORT: ${BACKEND_PORT:-5000}
    ports:
      - "${BACKEND_PORT:-5000}:${BACKEND_PORT:-5000}"
    environment:
      - PORT=${BACKEND_PORT:-5000}
      # Use DOCKER_* to avoid collisions with host env vars like MONGO_URI / JWT_SECRET.
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://mongo:27017/videostreaming}
      - JWT_SECRET=${DOCKER_JWT_SECRET:-change_me_in_dev}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PORT: ${FRONTEND_PORT:-8081}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
    ports:
      - "${FRONTEND_PORT:-8081}:${FRONTEND_PORT:-8081}"
    environment:
      - PORT=${FRONTEND_PORT:-8081}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:5000/api}
    depends_on:
      - backend
    restart: unless-stopped

  video-host:
    build:
      context: ./video-host
      dockerfile: Dockerfile
      args:
        PORT: ${VIDEO_HOST_PORT:-3000}
    ports:
      - "${VIDEO_HOST_PORT:-3000}:${VIDEO_HOST_PORT:-3000}"
    environment:
      - PORT=${VIDEO_HOST_PORT:-3000}
    volumes:
      - ./video-host/videos:/app/videos:ro
    restart: unless-stopped

  db-seeder:
    build:
      context: ./db-seeder
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=${DOCKER_MONGO_URI:-mongodb://mongo:27017/videostreaming}
      - VIDEO_HOST_PORT=${VIDEO_HOST_PORT:-3000}
      # These URLs are stored in Mongo and must be reachable from the host browser.
      - VIDEO_PUBLIC_BASE_URL=${VIDEO_PUBLIC_BASE_URL:-http://localhost:3000/videos}
      - VIDEO_DIR=/videos
    volumes:
      - ./video-host/videos:/videos:ro
    depends_on:
      mongo:
        condition: service_healthy
      video-host:
        condition: service_started
    profiles: ["seed"]
    restart: "no"

volumes:
  mongo-data:
